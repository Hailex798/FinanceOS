<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-fixed": "#ffdad7",
                        "surface-container-highest": "#343439",
                        "outline": "#908fa0",
                        "surface-bright": "#38393e",
                        "tertiary-fixed-dim": "#ffb3ad",
                        "on-error-container": "#ffdad6",
                        "tertiary-container": "#ff5451",
                        "secondary-container": "#00a572",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface": "#121317",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "on-primary-container": "#0d0096",
                        "surface-tint": "#c0c1ff",
                        "surface-container-low": "#1a1b20",
                        "surface-dim": "#121317",
                        "surface-container-high": "#292a2e",
                        "tertiary": "#ffb3ad",
                        "on-secondary": "#003824",
                        "primary-container": "#8083ff",
                        "outline-variant": "#464554",
                        "primary": "#c0c1ff",
                        "on-primary": "#1000a9",
                        "secondary": "#4edea3",
                        "on-surface-variant": "#c7c4d7",
                        "secondary-fixed": "#6ffbbe",
                        "error-container": "#93000a",
                        "primary-fixed": "#e1e0ff",
                        "background": "#121317",
                        "on-tertiary-fixed-variant": "#930013",
                        "inverse-primary": "#494bd6",
                        "on-secondary-container": "#00311f",
                        "on-tertiary-container": "#5c0008",
                        "on-error": "#690005",
                        "on-background": "#e3e2e8",
                        "on-surface": "#e3e2e8",
                        "error": "#ffb4ab",
                        "surface-variant": "#343439",
                        "surface-container": "#1f1f24",
                        "surface-container-lowest": "#0d0e12",
                        "on-primary-fixed": "#07006c",
                        "on-secondary-fixed": "#002113",
                        "inverse-on-surface": "#2f3035",
                        "on-secondary-fixed-variant": "#005236",
                        "on-tertiary": "#68000a",
                        "inverse-surface": "#e3e2e8",
                        "secondary-fixed-dim": "#4edea3",
                        "on-tertiary-fixed": "#410004"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0e12;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(31, 31, 36, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .radial-glow {
            background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.12) 0%, rgba(13, 14, 18, 0) 70%);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="antialiased text-on-surface selection:bg-primary-container selection:text-on-primary-container">
    <div class="relative min-h-screen flex items-center justify-center overflow-hidden">
        <!-- Ambient Background Glow -->
        <div class="absolute inset-0 radial-glow pointer-events-none"></div>
        <!-- Abstract Background Element -->
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/5 rounded-full blur-[120px] pointer-events-none">
        </div>
        <div
            class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-secondary/5 rounded-full blur-[100px] pointer-events-none">
        </div>
        <!-- Login Container -->
        <main class="relative z-10 w-full max-w-[420px] px-6">
            <div class="glass-card p-10 rounded-xl shadow-2xl flex flex-col gap-8">
                <!-- Brand Header -->
                <div class="flex flex-col items-center text-center gap-2">
                    <div
                        class="w-12 h-12 flex items-center justify-center bg-primary rounded-lg mb-2 shadow-[0_0_20px_rgba(99,102,241,0.3)]">
                        <span class="material-symbols-outlined text-on-primary text-3xl"
                            style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight text-on-surface">Finance OS</h1>
                    <p class="text-on-surface-variant text-sm tracking-wide">Enter your credentials to access the
                        ledger.</p>
                </div>
                <!-- Form Section -->
                <form class="flex flex-col gap-5">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold uppercase tracking-[0.1em] text-on-surface-variant ml-1"
                            for="email">Email Address</label>
                        <div class="relative group">
                            <input
                                class="w-full bg-surface-container-low border-b border-outline-variant text-on-surface text-sm py-3 px-1 focus:outline-none focus:border-primary focus:bg-surface-container-high transition-all duration-300 placeholder:text-outline"
                                id="email" placeholder="name@company.com" type="email" />
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <div class="flex justify-between items-center ml-1">
                            <label class="text-[11px] font-bold uppercase tracking-[0.1em] text-on-surface-variant"
                                for="password">Password</label>
                            <a class="text-[11px] font-medium text-primary hover:text-primary-container transition-colors"
                                href="#">Forgot Password?</a>
                        </div>
                        <div class="relative group">
                            <input
                                class="w-full bg-surface-container-low border-b border-outline-variant text-on-surface text-sm py-3 px-1 focus:outline-none focus:border-primary focus:bg-surface-container-high transition-all duration-300 placeholder:text-outline"
                                id="password" placeholder="••••••••" type="password" />
                        </div>
                    </div>
                    <button
                        class="mt-4 w-full bg-primary hover:bg-primary-container text-on-primary font-bold py-3.5 rounded-lg transition-all duration-300 active:scale-[0.98] shadow-[0_4px_12px_rgba(99,102,241,0.2)]"
                        type="submit">
                        Sign In
                    </button>
                </form>
                <!-- Divider -->
                <div class="relative flex items-center py-2">
                    <div class="flex-grow border-t border-outline-variant/30"></div>
                    <span
                        class="flex-shrink mx-4 text-[10px] font-bold uppercase tracking-[0.2em] text-outline">OR</span>
                    <div class="flex-grow border-t border-outline-variant/30"></div>
                </div>
                <!-- Social Auth -->
                <div class="flex flex-col gap-4">
                    <button
                        class="w-full flex items-center justify-center gap-3 bg-transparent border border-outline-variant/50 hover:bg-white/5 text-on-surface py-3 rounded-lg transition-all duration-300 active:scale-[0.98]">
                        <img alt="Google Logo" class="w-5 h-5"
                            data-alt="Official Google G logo with standard brand colors on a transparent background"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwrEwv0MNJ2cMOv-hweK3Bi1G0X1qG3opxWGCpt-rAE_mTYgD2Cch6wnRWIsu7mgP0pTcyWsCUljHPDGZyoEbPoY0vqUBAQRvtsr-zP7joF0PbZFU7lFl9B5QEGFr1Dx8vXgV3icdaVNFzS6mRW3atiiEQDVJ0FIMjz-FyssLDmHgsZTk1d7HMgxYnVB4GXBC5rtrbS99kguyt21yV1Ma6H991z1rS5UiCUgE3PB9mpk9OKy3L0sHFqiwBvX6eMmxHtUkRgwWCI5gE" />
                        <span class="text-sm font-semibold">Continue with Google</span>
                    </button>
                </div>
                <!-- Footer Link -->
                <p class="text-center text-sm text-on-surface-variant">
                    Don't have an account?
                    <a class="text-primary font-semibold hover:underline decoration-primary/30 underline-offset-4 transition-all"
                        href="#">Sign up</a>
                </p>
            </div>
            <!-- Operational Meta -->
            <div class="mt-8 flex justify-between items-center px-4">
                <div class="flex items-center gap-2 opacity-40">
                    <div class="w-1.5 h-1.5 rounded-full bg-secondary"></div>
                    <span class="text-[10px] font-mono uppercase tracking-widest">Network Secure</span>
                </div>
                <div class="flex gap-4 opacity-40">
                    <span class="text-[10px] font-mono uppercase tracking-widest">v4.0.2</span>
                    <span class="text-[10px] font-mono uppercase tracking-widest">Shard-01</span>
                </div>
            </div>
        </main>
        <!-- Decorative UI Elements -->
        <div class="absolute bottom-0 left-0 p-8 hidden md:block opacity-20 pointer-events-none">
            <div class="flex flex-col gap-1 font-mono text-[10px] text-primary">
                <span>// ENCRYPTION_LAYER_ACTIVE</span>
                <span>// PROTOCOL_AUTH_OIDC</span>
                <span>// KEY_DERIVATION_PBKDF2</span>
            </div>
        </div>
        <div class="absolute top-0 right-0 p-8 hidden md:block opacity-10 pointer-events-none">
            <div class="w-48 h-48 border border-outline/20 rounded-full flex items-center justify-center">
                <div
                    class="w-32 h-32 border border-outline/20 rounded-full flex items-center justify-center border-dashed">
                    <div class="w-16 h-16 border border-outline/20 rounded-full"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
